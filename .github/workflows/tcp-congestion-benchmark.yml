name: TCP congestion benchmark

on:
  push:
    branches:
      - chatgpt-tcp-congestion-benchmark-20260915

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout benchmark script
        uses: actions/checkout@v4

      - name: Prepare tools (no apt update)
        shell: bash
        run: |
          set -euxo pipefail
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y iperf3 mininet
          sudo modprobe tcp_cubic || true
          sudo modprobe tcp_bbr || true
          echo "Algorithms: $(cat /proc/sys/net/ipv4/tcp_available_congestion_control)"
          iperf3 --version
          mn --version

      - name: Run Mininet tests
        shell: bash
        run: |
          set -euxo pipefail
          sudo mn -c || true
          sudo python3 tcp_benchmark_mininet.py
          sudo mn -c || true
